name: Nightly DB backup

# Free automated backup of the Supabase Postgres database.
# Runs every night and keeps a downloadable copy for 90 days (GitHub Actions
# artifacts). Also runnable on demand from the Actions tab ("Run workflow").
#
# One-time setup: add a repo secret named SUPABASE_DB_URL
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   Value = Supabase → Connect → Session pooler → URI (port 5432), password filled in.

on:
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC daily (~00:30 IST)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database (pg_dump 17 via Docker — matches Supabase)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi
          ts=$(date -u +%Y-%m-%d_%H%M)
          docker run --rm -e DB_URL="$DB_URL" postgres:17-alpine \
            sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges' > "backup-$ts.sql"
          gzip "backup-$ts.sql"
          ls -lh backup-*.sql.gz

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz
          retention-days: 90
