name: Deploy to Firebase Hosting on merge

# Deploys the site on every push to main.
#
# WHY THIS DOES NOT USE FirebaseExtended/action-hosting-deploy
# -----------------------------------------------------------
# It used to. From 2026-08-06 every run failed at "Set up job" — before a
# single step executed — while the nightly DB backup in this same repo kept
# succeeding. The difference between the two was not the code: db-backup uses
# only actions/* (GitHub-authored), and this one reached for a third-party
# action. A job that dies in "Set up job" has not started work; it has been
# refused an action it was told to fetch. That is a repository Actions policy,
# not a bug in the workflow.
#
# Rather than depend on that setting staying permissive, this deploys with the
# firebase CLI directly. Every action referenced below is GitHub-authored, so
# the strictest "allow actions created by GitHub" policy still runs it. The
# side benefit is that there is no wrapper to go stale between us and a CLI
# that is already the thing we run locally.
#
# SECRET: FIREBASE_SERVICE_ACCOUNT_MMPAKKAM — the whole service-account JSON.
#         Unchanged from the previous workflow, so nothing to re-add.

on:
  push:
    branches:
      - main
  # Lets you re-run a failed deploy from the Actions tab without an empty commit.
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Written to RUNNER_TEMP, not the workspace: a key inside the checkout
      # could be picked up by the deploy's own file glob and published.
      - name: Write service-account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MMPAKKAM }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_MMPAKKAM is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          # Fail loudly here rather than let the CLI report a vague auth error.
          node -e 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/sa.json","utf8"))' \
            || { echo "::error::The secret is not valid JSON — re-paste the whole key file."; exit 1; }

      - name: Deploy to Firebase Hosting
        working-directory: 'MM Pakkam'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install -g firebase-tools@latest
          firebase deploy --only hosting --project mybillware --non-interactive
