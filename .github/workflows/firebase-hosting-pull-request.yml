name: Deploy to Firebase Hosting on PR

# Preview channel for pull requests. Same shape as the merge workflow and for
# the same reasons — see the long comment in firebase-hosting-merge.yml. In
# short: no third-party actions, because a repository Actions policy refuses
# them in "Set up job" before a workflow runs anything.
#
# This file was also deploying to projectId `mmpakkam`, a dead project whose
# host now 404s. The live project is `mybillware`.

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # Forks do not get the secret, so the deploy could only fail confusingly.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write service-account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MMPAKKAM }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_MMPAKKAM is not set."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Deploy preview channel
        id: preview
        working-directory: 'MM Pakkam'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install -g firebase-tools@latest
          # A channel per PR, expiring on its own so previews cannot pile up.
          firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project mybillware --expires 7d --non-interactive --json > channel.json
          cat channel.json
          url=$(node -e 'const j=require("./channel.json");const r=j.result||{};const k=Object.keys(r)[0];console.log(k?r[k].url:"")')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the PR
        if: ${{ steps.preview.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview: ${{ steps.preview.outputs.url }}\n\nExpires in 7 days.`
            });
