    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            color: #eaf6fb;
            background:
                radial-gradient(1100px 760px at 12% -8%, rgba(34,211,238,0.24), transparent 60%),
                radial-gradient(980px 660px at 106% 110%, rgba(2,132,199,0.30), transparent 58%),
                radial-gradient(720px 540px at 86% 2%, rgba(14,165,233,0.16), transparent 62%),
                linear-gradient(160deg, #05263f 0%, #041f36 52%, #062b47 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* Background orbs (ocean) */
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(110px); pointer-events: none;
        }
        .orb-1 {
            width: 520px; height: 520px; opacity: 0.34;
            background: radial-gradient(circle, #22d3ee, transparent 70%);
            top: -180px; right: -100px;
            animation: orbFloat 15s ease-in-out infinite;
        }
        .orb-2 {
            width: 440px; height: 440px; opacity: 0.28;
            background: radial-gradient(circle, #0284c7, transparent 70%);
            bottom: -120px; left: -80px;
            animation: orbFloat 18s ease-in-out infinite reverse;
        }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0); }
            50%      { transform: translate(16px, -18px); }
        }

        /* Grid overlay (faded at edges) */
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none;
            -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 74%);
                    mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 74%);
        }

        /* ── Pharmacy / hospital icon field ── */
        .rx-field { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .rx-ico {
            --r: 0deg; position: absolute;
            color: #5fe1f5; stroke: currentColor; fill: none;
            stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 0 9px rgba(34,211,238,0.45));
            animation: floaty 16s ease-in-out infinite; will-change: transform;
        }
        .rx-ico.solid { fill: currentColor; stroke: none; }
        @keyframes floaty {
            0%, 100% { transform: translateY(0) rotate(var(--r)); }
            50%      { transform: translateY(-18px) rotate(calc(var(--r) + 5deg)); }
        }
        .i1  { top: 10%; left: 6%;  width: 54px; opacity: 0.22; --r: -18deg; animation-duration: 15s; }
        .i2  { top: 20%; left: 85%; width: 48px; opacity: 0.20; --r: 12deg;  animation-duration: 18s; animation-delay: 1s; }
        .i3  { top: 65%; left: 5%;  width: 58px; opacity: 0.19; --r: 8deg;   animation-duration: 17s; animation-delay: 0.5s; }
        .i4  { top: 76%; left: 87%; width: 54px; opacity: 0.22; --r: -6deg;  animation-duration: 19s; animation-delay: 2s; }
        .i5  { top: 44%; left: 90%; width: 66px; opacity: 0.18; --r: 0deg;   animation-duration: 14s; animation-delay: 1.5s; }
        .i6  { top: 83%; left: 35%; width: 46px; opacity: 0.17; --r: 6deg;   animation-duration: 20s; animation-delay: 3s; }
        .i7  { top: 6%;  left: 56%; width: 34px; opacity: 0.20; --r: 0deg;   animation-duration: 13s; animation-delay: 0.8s; }
        .i8  { top: 55%; left: 73%; width: 48px; opacity: 0.18; --r: 10deg;  animation-duration: 21s; animation-delay: 2.5s; }
        .i9  { top: 87%; left: 9%;  width: 40px; opacity: 0.18; --r: -20deg; animation-duration: 16s; animation-delay: 1.2s; }
        .i10 { top: 30%; left: 10%; width: 44px; opacity: 0.17; --r: -10deg; animation-duration: 18s; animation-delay: 3.5s; }
        .i11 { top: 12%; left: 37%; width: 58px; opacity: 0.14; --r: 4deg;   animation-duration: 22s; animation-delay: 1.8s; }
        .i12 { top: 60%; left: 27%; width: 40px; opacity: 0.15; --r: -14deg; animation-duration: 15s; animation-delay: 2.2s; }
        .i13 { top: 40%; left: 17%; width: 46px; opacity: 0.16; --r: 6deg;   animation-duration: 19s; animation-delay: 0.4s; }
        .i14 { top: 8%;  left: 74%; width: 46px; opacity: 0.18; --r: -8deg;  animation-duration: 17s; animation-delay: 2.8s; }
        .i15 { top: 70%; left: 55%; width: 50px; opacity: 0.15; --r: 12deg;  animation-duration: 20s; animation-delay: 1.1s; }
        .i16 { top: 88%; left: 66%; width: 42px; opacity: 0.18; --r: -6deg;  animation-duration: 16s; animation-delay: 3.2s; }
        @media (max-width: 620px) {
            .i2, .i5, .i8, .i11, .i14, .i15 { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .rx-ico, .orb, .logo-icon::after { animation: none; }
        }

        /* â”€â”€ Wrap & Card â”€â”€ */
        .setup-wrap {
            position: relative; z-index: 10;
            width: 100%; max-width: 480px;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        .setup-card {
            width: 100%;
            background: rgba(9, 40, 63, 0.58);
            backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid rgba(120,220,255,0.15);
            border-radius: 28px; padding: 2.8rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08),
                        0 40px 80px -20px rgba(0,0,0,0.7);
            animation: cardIn 0.55s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(24px) scale(0.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }

        /* â”€â”€ Logo â”€â”€ */
        .logo-row {
            display: flex; align-items: center; gap: 13px;
            margin-bottom: 2rem;
        }
        .logo-icon {
            width: 48px; height: 48px; border-radius: 15px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9, #38bdf8);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 900; font-size: 1.1rem;
            box-shadow: 0 6px 24px rgba(14,165,233,0.45);
            border: 1px solid rgba(255,255,255,0.25);
            position: relative; overflow: hidden; flex-shrink: 0;
        }
        .logo-icon::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.35), transparent);
            transform: skewX(-18deg); animation: shimmer 3.5s infinite;
        }
        @keyframes shimmer { 0%{left:-100%} 25%{left:200%} 100%{left:200%} }
        .logo-name  { font-size: 0.95rem; font-weight: 800; color: white; line-height: 1.3; }
        .logo-sub   { font-size: 0.72rem; color: rgba(148,163,184,0.8); font-weight: 500; }

        /* â”€â”€ Mode Badge â”€â”€ */
        .mode-badge {
            display: inline-flex; align-items: center; gap: 6px;
            border-radius: 50px; padding: 5px 14px;
            font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em;
            text-transform: uppercase; margin-bottom: 1.4rem;
        }
        .badge-owner  {
            background: linear-gradient(135deg, rgba(34,211,238,0.18), rgba(14,165,233,0.08));
            border: 1px solid rgba(56,189,248,0.4); color: #67e8f9;
        }
        .badge-worker {
            background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(139,92,246,0.08));
            border: 1px solid rgba(139,92,246,0.35); color: #a78bfa;
        }

        /* â”€â”€ Heading â”€â”€ */
        .card-heading { margin-bottom: 1.6rem; }
        .card-heading h1 {
            font-size: 1.55rem; font-weight: 900; color: white;
            letter-spacing: -0.02em; margin-bottom: 0.35rem;
        }
        .card-heading p { font-size: 0.84rem; color: rgba(100,116,139,0.9); line-height: 1.6; }

        /* â”€â”€ Divider â”€â”€ */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent);
            margin-bottom: 1.5rem;
        }

        /* â”€â”€ Info box â”€â”€ */
        .info-box {
            background: rgba(14,165,233,0.08); border: 1px solid rgba(14,165,233,0.2);
            border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 1.5rem;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .info-box-icon { flex-shrink: 0; margin-top: 1px; }
        .info-box p { font-size: 0.8rem; color: rgba(148,163,184,0.9); line-height: 1.6; }
        .info-box strong { color: #7dd3fc; }

        /* â”€â”€ Section label â”€â”€ */
        .section-label {
            font-size: 0.68rem; font-weight: 800; letter-spacing: 0.09em;
            text-transform: uppercase; color: rgba(100,116,139,0.7);
            margin-bottom: 0.8rem; margin-top: 1.4rem;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::after {
            content: ''; flex: 1; height: 1px;
            background: rgba(255,255,255,0.07);
        }
        .section-label:first-of-type { margin-top: 0; }

        /* â”€â”€ Form â”€â”€ */
        .form-group { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 1.1rem; }
        .form-group label {
            font-size: 0.72rem; font-weight: 800; letter-spacing: 0.07em;
            text-transform: uppercase; color: rgba(100,116,139,1);
        }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            opacity: 0.4; pointer-events: none; display: flex; align-items: center;
        }
        .form-group input {
            font-family: 'Inter', sans-serif; font-size: 0.93rem; color: white;
            background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 0.82rem 3rem 0.82rem 2.85rem;
            outline: none; width: 100%; transition: all 0.22s ease; -webkit-appearance: none;
        }
        /* Inputs without eye icon don't need right padding */
        .no-right-pad { padding-right: 1rem !important; }
        .form-group input::placeholder { color: rgba(100,116,139,0.55); }
        .form-group input:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18); }
        .form-group input:focus {
            background: rgba(14,165,233,0.08); border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
        }
        .form-group input.green-focus:focus {
            background: rgba(16,185,129,0.08); border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
        }

        /* Eye toggle */
        .pw-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: rgba(100,116,139,0.55); padding: 5px; border-radius: 6px;
            display: flex; align-items: center; transition: color 0.2s; line-height: 0;
        }
        .pw-toggle:hover { color: rgba(148,163,184,1); }

        /* Strength bar */
        .strength-wrap { margin-top: 7px; display: flex; gap: 4px; }
        .strength-seg {
            flex: 1; height: 3px; border-radius: 2px;
            background: rgba(255,255,255,0.08); transition: background 0.3s;
        }
        .strength-seg.weak   { background: #ef4444; }
        .strength-seg.medium { background: #f59e0b; }
        .strength-seg.strong { background: #10b981; }
        .strength-lbl { font-size: 0.7rem; color: rgba(100,116,139,0.7); margin-top: 4px; }

        /* â”€â”€ Error box â”€â”€ */
        .error-box {
            display: flex; align-items: flex-start; gap: 10px;
            background: rgba(239,68,68,0.1); border: 1.5px solid rgba(239,68,68,0.25);
            border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 1.2rem;
            visibility: hidden; opacity: 0;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .error-box.visible { visibility: visible; opacity: 1; }
        .error-box.shake   { animation: shake 0.4s ease; }
        @keyframes shake {
            0%,100%{ transform:translateX(0) }
            20%    { transform:translateX(-6px) }
            40%    { transform:translateX(6px) }
            60%    { transform:translateX(-4px) }
            80%    { transform:translateX(4px) }
        }
        .error-text { font-size: 0.83rem; font-weight: 600; color: #fca5a5; line-height: 1.5; }

        /* â”€â”€ Submit button â”€â”€ */
        .submit-btn {
            width: 100%; padding: 0.9rem 1.5rem; border-radius: 12px; border: none; cursor: pointer;
            font-family: 'Inter', sans-serif; font-size: 0.97rem; font-weight: 800;
            color: white; box-shadow: 0 4px 20px rgba(16,185,129,0.4);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 1.6rem; position: relative; overflow: hidden;
        }
        .submit-btn.owner-btn {
            background: linear-gradient(135deg, #22d3ee 0%, #0ea5e9 48%, #0369a1 100%);
            box-shadow: 0 8px 22px -4px rgba(34,211,238,0.5);
        }
        .submit-btn.worker-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 20px rgba(16,185,129,0.4);
        }
        .submit-btn.danger-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 20px rgba(239,68,68,0.4);
        }
        .submit-btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
        }
        .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(16,185,129,0.55); }
        .submit-btn.owner-btn:hover:not(:disabled) { box-shadow: 0 14px 30px -6px rgba(34,211,238,0.62); }
        .submit-btn.danger-btn:hover:not(:disabled) { box-shadow: 0 8px 28px rgba(239,68,68,0.55); }
        .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

        /* Danger warning box */
        .danger-box {
            background: rgba(239,68,68,0.08);
            border: 1.5px solid rgba(239,68,68,0.3);
            border-radius: 14px; padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
            display: flex; gap: 12px; align-items: flex-start;
        }
        .danger-box p { font-size: 0.82rem; color: rgba(252,165,165,0.95); line-height: 1.6; }
        .danger-box strong { color: #fca5a5; }
        .confirm-input {
            font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 800;
            color: #ef4444; letter-spacing: 0.12em; text-transform: uppercase;
            background: rgba(239,68,68,0.07);
            border: 1.5px solid rgba(239,68,68,0.3);
            border-radius: 12px; padding: 0.85rem 1rem;
            outline: none; width: 100%; transition: all 0.22s ease;
            -webkit-appearance: none;
        }
        .confirm-input::placeholder { color: rgba(239,68,68,0.35); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 0.88rem; }
        .confirm-input:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.18); background: rgba(239,68,68,0.1); }
        .or-divider {
            display: flex; align-items: center; gap: 12px;
            margin: 1.8rem 0;
        }
        .or-divider::before, .or-divider::after {
            content: ''; flex: 1; height: 1px;
            background: rgba(255,255,255,0.07);
        }
        .or-divider span { font-size: 0.72rem; color: rgba(100,116,139,0.6); font-weight: 700; letter-spacing: 0.06em; }

        /* â”€â”€ Back to login link â”€â”€ */
        .back-login {
            margin-top: 1.5rem; text-align: center;
            display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .back-login span { font-size: 0.84rem; color: rgba(100,116,139,0.8); }
        .back-login a {
            font-size: 0.84rem; font-weight: 700; color: #38bdf8;
            text-decoration: none; border-bottom: 1.5px solid rgba(56,189,248,0.35);
            padding-bottom: 1px; transition: color 0.2s, border-color 0.2s;
        }
        .back-login a:hover { color: #7dd3fc; border-color: rgba(125,211,252,0.6); }

        .footer-txt {
            margin-top: 1.2rem; text-align: center;
            font-size: 0.7rem; color: rgba(71,85,105,0.7);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.7s linear infinite; display: inline-block; }

        @media (max-width: 520px) {
            .setup-card { padding: 2rem 1.5rem; }
        }
    </style>

    <div class="setup-wrap">
        <div class="setup-card" id="setupCard">
            <!-- Logo -->
            <div class="logo-row">

    <script>
        function showError(msg) {
            const box = document.getElementById('errBox');
            if (!box) return;
            box.querySelector('.error-text').textContent = msg;
            box.classList.remove('shake');
            box.classList.add('visible');
            void box.offsetWidth;
            box.classList.add('shake');
        }
        function hideError() {
            const box = document.getElementById('errBox');
            if (box) box.classList.remove('visible', 'shake');
        }

        function togglePw(inputId, openId, closedId) {
            const inp    = document.getElementById(inputId);
            const open   = document.getElementById(openId);
            const closed = document.getElementById(closedId);
            const show   = inp.type === 'password';
            inp.type             = show ? 'text' : 'password';
            open.style.display   = show ? 'none' : '';
            closed.style.display = show ? '' : 'none';
        }

        function updateStrength(inputId) {
            const pw   = document.getElementById(inputId).value;
            const segs = ['s1','s2','s3','s4'].map(id => document.getElementById(id));
            const lbl  = document.getElementById('strengthLbl');
            if (!lbl) return;
            segs.forEach(s => s && (s.className = 'strength-seg'));
            if (!pw) { lbl.textContent = 'Enter a password'; return; }
            let score = 0;
            if (pw.length >= 6)  score++;
            if (pw.length >= 10) score++;
            if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
            if (/[0-9]/.test(pw) || /[^A-Za-z0-9]/.test(pw)) score++;
            const levels = ['weak','weak','medium','strong'];
            const labels = ['Too short','Weak','Moderate','Strong ✨'];
            for (let i = 0; i < score; i++) segs[i] && segs[i].classList.add(levels[score - 1]);
            lbl.textContent = labels[score - 1] || 'Too short';
        }

        // ——— Render the single unified Create Account form ———
        function renderSetup() {
            document.getElementById('pageContent').innerHTML = `
                <div class="mode-badge badge-owner">
                    <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    New Store Account
                </div>

                <div class="card-heading">
                    <h1>Create Account</h1>
                    <p>Each account is a completely independent store. Your data is private and isolated from all other accounts.</p>
                </div>
                <div class="divider"></div>

                <div class="error-box" id="errBox">
                    <svg width="15" height="15" fill="none" stroke="#f87171" stroke-width="2.5" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:2px">
                        <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01"/>
                    </svg>
                    <span class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="ownerUser">Account Username</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="15" height="15" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </span>
                        <input type="text" id="ownerUser" class="no-right-pad" placeholder="e.g. your_name" autocomplete="username" spellcheck="false">
                    </div>
                </div>

                <div class="form-group">
                    <label for="ownerPw">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="15" height="15" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="ownerPw" placeholder="Create a strong password" autocomplete="new-password" oninput="updateStrength('ownerPw')">
                        <button type="button" class="pw-toggle" onclick="togglePw('ownerPw','oe1','oc1')">
                            <svg id="oe1" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="oc1" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength-wrap">
                        <div class="strength-seg" id="s1"></div>
                        <div class="strength-seg" id="s2"></div>
                        <div class="strength-seg" id="s3"></div>
                        <div class="strength-seg" id="s4"></div>
                    </div>
                    <div class="strength-lbl" id="strengthLbl">Enter a password</div>
                </div>

                <div class="form-group">
                    <label for="ownerConfirm">Confirm Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="15" height="15" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                            </svg>
                        </span>
                        <input type="password" id="ownerConfirm" placeholder="Re-enter your password" autocomplete="new-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('ownerConfirm','oe2','oc2')">
                            <svg id="oe2" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="oc2" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="submit-btn owner-btn" id="submitBtn" onclick="handleCreateAccount()">
                    <svg id="btnIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <span id="btnText">Create Account</span>
                </button>

                <div class="back-login">
                    <span>Already have an account?</span>
                    <a href="#" onclick="window.location.href='login.html';return false;">Sign in</a>
                </div>
                <p class="footer-txt">&copy; 2026 Billware</p>
            `;
        }

        /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
           HANDLERS
        â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
        function setBtnLoading(msg) {
            const btn  = document.getElementById('submitBtn');
            const text = document.getElementById('btnText');
            const icon = document.getElementById('btnIcon');
            btn.disabled = true;
            icon.outerHTML = `<svg id="btnIcon" class="spinner" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>`;
            text.textContent = msg;
        }
        function setBtnDone(msg) {
            const btn  = document.getElementById('submitBtn');
            const text = document.getElementById('btnText');
            const icon = document.getElementById('btnIcon');
            btn.disabled = true;
            icon.outerHTML = `<svg id="btnIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
            text.textContent = msg;
            btn.style.background = 'linear-gradient(135deg,#10b981,#059669)';
            btn.style.boxShadow  = '0 4px 20px rgba(16,185,129,0.45)';
        }
        function resetBtn() {
            const btn  = document.getElementById('submitBtn');
            const text = document.getElementById('btnText');
            btn.disabled = false;
            document.getElementById('btnIcon').outerHTML = `<svg id="btnIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>`;
            text.textContent = 'Create Account';
        }

        async function handleCreateAccount() {
            hideError();
            
            const username = document.getElementById('ownerUser').value.trim();
            const password = document.getElementById('ownerPw').value;
            const confirm  = document.getElementById('ownerConfirm').value;
            
            if (username.length < 3) return showError('Username must be at least 3 characters.');
            if (password.length < 6) return showError('Password must be at least 6 characters.');
            if (password !== confirm) return showError('Passwords do not match.');
            
            setBtnLoading('Creating account...');
            const result = await mmCreateOwner(username, password, null);
            if (result.success) {
                setBtnDone('Account Created!');
                // Redirect to shop setup page 
                setTimeout(() => {
                    window.location.href = 'shop-setup.html?tenant=' + encodeURIComponent(username);
                }, 600);
            } else {
                showError(result.message);
                resetBtn();
            }
        }

        // â”€â”€ Init: always show the create account form â”€â”€
        renderSetup();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => {
                        console.log('[PWA] SW registered:', reg.scope);
                        // Force new SW to activate and reload for fresh files
                        reg.addEventListener('updatefound', () => {
                            const nw = reg.installing;
                            if (!nw) return;
                            nw.addEventListener('statechange', () => {
                                if (nw.state === 'installed') {
                                    // Tell new SW to skip waiting immediately
                                    nw.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch(e => console.warn('[PWA] SW failed:', e));
                // Reload when new SW takes control so fresh files are served
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    window.location.reload();
                });
            });
        }
    </script></body>
