<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Orders | Billware</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js?v=3"></script>
    <script src="js/supabase.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; min-height: 100vh; color: #0f172a;
            background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 50%, #f0fdf4 100%);
            background-attachment: fixed; display: flex; flex-direction: column;
        }
        header {
            background: rgba(255,255,255,0.85); backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(99,102,241,0.1);
            padding: 0.85rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9, #10b981);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 900; font-size: 1.15rem;
            box-shadow: 0 6px 16px rgba(14,165,233,0.4);
        }
        .logo-text { font-size: 1.25rem; font-weight: 800; color: #0f172a; letter-spacing: -0.01em; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 0.45rem 1rem;
            background: rgba(255,255,255,0.8); border: 1.5px solid rgba(0,0,0,0.08);
            border-radius: 10px; font-size: 0.82rem; font-weight: 700; color: #0f172a;
            text-decoration: none; transition: all 0.2s ease;
        }
        .back-btn:hover { background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }

        .page-content { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
        .page-title { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; }
        .page-sub { color: #64748b; font-size: 0.85rem; margin-top: 4px; margin-bottom: 1.4rem; }

        .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
        .tab-btn {
            padding: 0.45rem 1rem; border: 1.5px solid #e2e8f0; background: rgba(255,255,255,0.7);
            border-radius: 10px; font-size: 0.8rem; font-weight: 700; color: #475569; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: all 0.2s ease;
        }
        .tab-btn:hover { background: #fff; color: #0284c7; }
        .tab-btn.active { background: linear-gradient(135deg, #0284c7, #0891b2); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(2,132,199,0.3); }

        .table-wrap { background: #fff; border: 1px solid #e8eef5; border-radius: 18px; box-shadow: 0 4px 16px rgba(15,23,42,0.05); overflow: hidden; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 780px; }
        thead th {
            text-align: left; font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.06em; color: #64748b; padding: 0.9rem 1rem; background: #f8fafc;
            border-bottom: 1px solid #e2e8f0; white-space: nowrap;
        }
        tbody td { padding: 0.85rem 1rem; font-size: 0.85rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tbody tr:hover { background: #f8fafc; }
        .cust-name { font-weight: 700; color: #0f172a; }
        .cust-phone { font-size: 0.75rem; color: #94a3b8; }
        .med-name { font-weight: 600; color: #334155; }

        .badge { display: inline-block; font-size: 0.68rem; font-weight: 800; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
        .badge-pending  { background: #fef9c3; color: #a16207; }
        .badge-ordered  { background: #dbeafe; color: #1d4ed8; }
        .badge-arrived  { background: #dcfce7; color: #15803d; }
        .badge-fulfilled{ background: #e2e8f0; color: #475569; }

        .act-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .act {
            border: none; border-radius: 8px; padding: 5px 10px; font-size: 0.72rem; font-weight: 700;
            cursor: pointer; font-family: 'Inter', sans-serif; color: #fff; white-space: nowrap;
        }
        .act-ordered  { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .act-arrived  { background: linear-gradient(135deg, #059669, #10b981); }
        .act-sale     { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
        .act:disabled { opacity: 0.4; cursor: not-allowed; }

        .empty { text-align: center; padding: 3rem 1rem; color: #94a3b8; }
        .empty .big { font-size: 2.4rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <div class="logo-icon">MP</div>
            <div class="logo-text">Promise Orders</div>
        </a>
        <a href="index.html" class="back-btn">&larr; Dashboard</a>
    </header>

    <div class="page-content">
        <div class="page-title">📦 Promise Orders</div>
        <div class="page-sub">Customer backorders for medicines not currently in stock. Lifecycle: Pending → Ordered → Arrived → Fulfilled.</div>

        <div class="tabs" id="tabs">
            <button class="tab-btn active" data-filter="all"       onclick="setFilter('all', this)">All</button>
            <button class="tab-btn"        data-filter="pending"   onclick="setFilter('pending', this)">Pending</button>
            <button class="tab-btn"        data-filter="ordered"   onclick="setFilter('ordered', this)">Ordered</button>
            <button class="tab-btn"        data-filter="arrived"   onclick="setFilter('arrived', this)">Arrived</button>
            <button class="tab-btn"        data-filter="fulfilled" onclick="setFilter('fulfilled', this)">Fulfilled</button>
        </div>

        <div class="table-wrap">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Medicine</th>
                            <th>Qty</th>
                            <th>Promise Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <tr><td colspan="6" class="empty">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let _orders = [];
        let _filter = 'all';

        function escHtml(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : str; return d.innerHTML; }

        function fmtDate(d) {
            if (!d) return '—';
            try { return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
            catch (e) { return d; }
        }

        function setFilter(f, btn) {
            _filter = f;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            render();
        }

        async function loadOrders() {
            if (typeof dbGetPromiseOrders !== 'function') return;
            try { _orders = await dbGetPromiseOrders(); } catch (e) { _orders = []; console.warn(e); }
            render();
        }

        function render() {
            const body = document.getElementById('ordersBody');
            const rows = _filter === 'all' ? _orders : _orders.filter(o => o.status === _filter);

            if (!rows.length) {
                body.innerHTML = `<tr><td colspan="6" class="empty"><div class="big">📭</div>No ${_filter === 'all' ? '' : _filter + ' '}promise orders yet.</td></tr>`;
                return;
            }

            body.innerHTML = rows.map(o => {
                const status = o.status || 'pending';
                const badge = `<span class="badge badge-${status}">${status}</span>`;
                const canOrder  = status === 'pending';
                const canArrive = status === 'ordered' || status === 'pending';
                const canSale   = status !== 'fulfilled';
                const actions = `
                    <div class="act-btns">
                        <button class="act act-ordered" ${canOrder ? '' : 'disabled'} onclick="markStatus('${o.id}','ordered')">Mark Ordered</button>
                        <button class="act act-arrived" ${canArrive ? '' : 'disabled'} onclick="markStatus('${o.id}','arrived')">Mark Arrived</button>
                        <button class="act act-sale" ${canSale ? '' : 'disabled'} onclick="convertToSale('${o.id}')">Convert to Sale</button>
                    </div>`;
                return `
                    <tr>
                        <td>
                            <div class="cust-name">${escHtml(o.customer_name)}</div>
                            <div class="cust-phone">${escHtml(o.customer_phone) || 'No phone'}</div>
                        </td>
                        <td class="med-name">${escHtml(o.medicine_name)}</td>
                        <td>${escHtml(o.quantity)}</td>
                        <td>${fmtDate(o.promise_date)}</td>
                        <td>${badge}</td>
                        <td>${actions}</td>
                    </tr>`;
            }).join('');
        }

        async function markStatus(id, status) {
            if (typeof dbUpdatePromiseOrderStatus !== 'function') return;
            const o = _orders.find(x => x.id === id);
            const r = await dbUpdatePromiseOrderStatus(id, status);
            if (r && r.success) {
                if (o) o.status = status;
                render();
            } else {
                alert('Could not update. Please check your connection and try again.');
            }
        }

        async function convertToSale(id) {
            const o = _orders.find(x => x.id === id);
            if (!o) return;
            if (!confirm(`Convert this promise order for ${o.customer_name} into a sale?\n\nThis marks it Fulfilled and opens the Sales page with the customer & medicine pre-filled.`)) return;
            if (typeof dbUpdatePromiseOrderStatus === 'function') {
                try { await dbUpdatePromiseOrderStatus(id, 'fulfilled'); } catch (e) { console.warn(e); }
            }
            const url = 'sales.html?customer=' + encodeURIComponent(o.customer_name || '') +
                        '&medicine=' + encodeURIComponent(o.medicine_name || '');
            window.location.href = url;
        }

        // Wait for Supabase to restore the session before loading (see khata.html pattern).
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof mmInjectUserBar === 'function') { try { mmInjectUserBar(); } catch (e) {} }
            try { await _supabase.auth.getSession(); }
            catch (e) { await new Promise(r => setTimeout(r, 400)); }
            loadOrders();
        });
    </script>
</body>
</html>
