<!DOCTYPE html>
<html>
<body style="background: #1e293b; padding: 50px;">
  <div style="width: 152px; height: 152px; border-radius: 24px; background: linear-gradient(135deg, #0284c7, #0ea5e9, #10b981); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 32px rgba(2, 132, 199, 0.4);">
    <svg viewBox="0 0 100 100" width="80" height="80" xmlns="http://www.w3.org/2000/svg" style="z-index: 2; position: relative;">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.2" />
        </filter>
        <mask id="crossMask">
          <rect width="100" height="100" fill="white" />
          <rect x="42" y="32" width="16" height="36" rx="4" fill="black" />
          <rect x="32" y="42" width="36" height="16" rx="4" fill="black" />
        </mask>
        <g id="leaf">
          <path d="M 50 50 C 35 45, 30 30, 30 20 C 30 10, 45 10, 50 20 C 55 10, 70 10, 70 20 C 70 30, 65 45, 50 50 Z" fill="#ffffff" />
        </g>
      </defs>
      
      <g mask="url(#crossMask)" filter="url(#shadow)">
        <use href="#leaf" />
        <use href="#leaf" transform="rotate(90 50 50)" />
        <use href="#leaf" transform="rotate(180 50 50)" />
        <use href="#leaf" transform="rotate(270 50 50)" />
      </g>
    </svg>
  </div>
</body>
</html>
