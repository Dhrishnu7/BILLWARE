<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khata / Ledger | Billware</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/supabase.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, hsla(38,92%,90%,1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(24,94%,90%,1) 0px, transparent 50%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            color: #0f172a;
        }

        /* -- Navbar -- */
        header {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
            padding: 1rem 2rem;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }

        .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; transition: transform 0.2s ease; }
        .logo:hover { transform: translateY(-1px); }

        .logo-icon {
            width: 46px; height: 46px; border-radius: 14px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 900; font-size: 1.25rem;
            box-shadow: 0 6px 16px rgba(217,119,6,0.4), inset 0 2px 4px rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.5);
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1.35rem; font-weight: 800;
            background: linear-gradient(to right, #0f172a, #334155);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.01em;
        }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 0.5rem 1.2rem; background: white;
            border: 1.5px solid rgba(217,119,6,0.25); border-radius: 50px;
            font-size: 0.85rem; font-weight: 600; color: #d97706;
            cursor: pointer; transition: all 0.25s ease; text-decoration: none;
        }
        .back-btn:hover { background: #d97706; color: white; box-shadow: 0 4px 16px rgba(217,119,6,0.3); transform: translateY(-1px); }

        /* -- Page Content -- */
        .page-content { flex: 1; padding: 3rem 1.5rem 4rem; max-width: 1100px; margin: 0 auto; width: 100%; animation: fadeUp 0.5s ease forwards; opacity:0; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; }
        .page-header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; }
        .page-header p { color: #64748b; margin-top: 0.4rem; font-size: 1rem; }

        .stat-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white; border-radius: 20px; padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 2.5rem; text-align: center;
        }
        .stat-label { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
        .stat-value { font-size: 3.5rem; font-weight: 800; margin-top: 0.5rem; letter-spacing: -0.02em; color: #facc15; }

        /* -- Grid -- */
        .khata-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;
        }

        .customer-card {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.95); border-radius: 20px;
            padding: 1.5rem; box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; justify-content: space-between;
            transition: transform 0.2s;
        }
        .customer-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }

        .c-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.2rem; }
        .c-name { font-size: 1.15rem; font-weight: 800; color: #0f172a; }
        .c-phone { font-size: 0.85rem; color: #64748b; margin-top: 0.2rem; }
        
        .c-bal-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        .c-bal-value { font-size: 1.8rem; font-weight: 800; color: #ef4444; letter-spacing: -0.01em; margin-top: 0.2rem; }

        .btn-settle {
            background: #10b981; color: white; border: none; border-radius: 12px;
            padding: 0.75rem 0; width: 100%; font-weight: 700; font-size: 0.95rem; font-family: 'Inter', sans-serif;
            cursor: pointer; transition: all 0.2s; margin-top: 1.2rem; display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        .btn-settle:hover { background: #059669; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }

        .empty-state { text-align: center; padding: 4rem 1rem; color: #64748b; grid-column: 1 / -1; }
        .empty-state svg { width: 64px; height: 64px; color: #cbd5e1; margin-bottom: 1rem; }
        .empty-state h3 { font-size: 1.2rem; color: #0f172a; margin-bottom: 0.5rem; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 999;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        
        .modal {
            background: white; border-radius: 24px; padding: 2rem; width: 90%; max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.95); transition: transform 0.2s;
        }
        .modal-overlay.open .modal { transform: scale(1); }
        .modal h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
        .modal p { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.9rem 1.2rem; border-radius: 12px; border: 1.5px solid #cbd5e1; font-size: 1.1rem; font-weight: 700; font-family: 'Inter', sans-serif; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.1); }
        
        .modal-actions { display: flex; gap: 1rem; }
        .btn-cancel { flex: 1; background: #f1f5f9; color: #475569; border: none; padding: 0.9rem; border-radius: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-cancel:hover { background: #e2e8f0; }
        .btn-confirm { flex: 1; background: #10b981; color: white; border: none; padding: 0.9rem; border-radius: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-confirm:hover { background: #059669; }

        @media (max-width: 600px) {
            header { padding: 0.8rem 1rem; }
            .logo-text { font-size: 0.95rem; }
            .page-content { padding: 2rem 1rem 3rem; }
            .stat-value { font-size: 2.8rem; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <div class="logo-icon"><svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="z-index: 2; position: relative; transform: scale(0.85);"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.2" /></filter><mask id="crossMask"><rect width="100" height="100" fill="white" /><rect x="42" y="32" width="16" height="36" rx="4" fill="black" /><rect x="32" y="42" width="36" height="16" rx="4" fill="black" /><line x1="15" y1="15" x2="85" y2="85" stroke="black" stroke-width="2.5" stroke-linecap="round" /><line x1="15" y1="85" x2="85" y2="15" stroke="black" stroke-width="2.5" stroke-linecap="round" /></mask><g id="leaf"><path d="M 50 50 C 35 45, 30 30, 30 20 C 30 10, 45 10, 50 20 C 55 10, 70 10, 70 20 C 70 30, 65 45, 50 50 Z" fill="#ffffff" /></g></defs><g mask="url(#crossMask)" filter="url(#shadow)"><use href="#leaf" /><use href="#leaf" transform="rotate(90 50 50)" /><use href="#leaf" transform="rotate(180 50 50)" /><use href="#leaf" transform="rotate(270 50 50)" /></g></svg></div>
            <div class="logo-text">Billware</div>
        </a>
        <a href="index.html" class="back-btn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Dashboard
        </a>
    </header>

    <div class="page-content">
        <div class="page-header">
            <div>
                <div style="font-size:0.8rem; color:#94a3b8; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;">Customer Ledger</div>
                <h1>Digital Khata</h1>
                <p>Manage pending payments and credit accounts.</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Total Outstanding Dues</div>
            <div class="stat-value" id="totalOutstanding">₹ 0.00</div>
        </div>

        <div class="khata-grid" id="khataGrid">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Settle Dues Modal -->
    <div class="modal-overlay" id="settleModal">
        <div class="modal">
            <h2 id="modalTitle">Settle Dues</h2>
            <p id="modalSub">Record a payment from the customer.</p>
            
            <div class="form-group">
                <label>Amount Received (₹)</label>
                <input type="number" id="settleAmount" step="0.01" min="0" placeholder="0.00">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button type="button" class="btn-confirm" onclick="confirmSettle()">Save Payment</button>
            </div>
        </div>
    </div>

    <script>
        let currentCustIndex = -1;

        function renderKhata() {
            const customers = JSON.parse(localStorage.getItem('mm_customers') || '[]');
            
            // Filter customers who owe money (>0)
            const debtors = customers.filter(c => parseFloat(c.balance || 0) > 0);
            
            // Sort by highest balance first
            debtors.sort((a, b) => b.balance - a.balance);

            const grid = document.getElementById('khataGrid');
            const totalEl = document.getElementById('totalOutstanding');

            if (debtors.length === 0) {
                totalEl.textContent = '₹ 0.00';
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <h3>No Pending Dues!</h3>
                        <p>All your customers' accounts are clear.</p>
                    </div>
                `;
                return;
            }

            let total = 0;
            grid.innerHTML = '';

            debtors.forEach(cust => {
                total += cust.balance;
                
                // Find original index in mm_customers to update later
                const origIndex = customers.findIndex(c => c.name === cust.name && c.phone === cust.phone);

                const card = document.createElement('div');
                card.className = 'customer-card';
                card.innerHTML = \`
                    <div>
                        <div class="c-header">
                            <div>
                                <div class="c-name">\${cust.name}</div>
                                <div class="c-phone">\${cust.phone || 'No phone added'}</div>
                            </div>
                        </div>
                        <div>
                            <div class="c-bal-label">Pending Balance</div>
                            <div class="c-bal-value">₹ \${cust.balance.toFixed(2)}</div>
                        </div>
                    </div>
                    <button class="btn-settle" onclick="openSettleModal(\${origIndex}, '\${cust.name.replace(/'/g, "\\'")}', \${cust.balance})">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        Settle Dues
                    </button>
                \`;
                grid.appendChild(card);
            });

            totalEl.textContent = '₹ ' + total.toFixed(2);
        }

        function openSettleModal(index, name, currentBalance) {
            currentCustIndex = index;
            document.getElementById('modalTitle').textContent = \`Settle: \${name}\`;
            document.getElementById('modalSub').textContent = \`Current Balance: ₹\${currentBalance.toFixed(2)}\`;
            const amtInput = document.getElementById('settleAmount');
            amtInput.value = currentBalance.toFixed(2); // Default to full settlement
            
            document.getElementById('settleModal').classList.add('open');
            setTimeout(() => { amtInput.focus(); amtInput.select(); }, 100);
        }

        function closeModal() {
            document.getElementById('settleModal').classList.remove('open');
            currentCustIndex = -1;
        }

        function confirmSettle() {
            if (currentCustIndex < 0) return;
            
            const amountInput = document.getElementById('settleAmount').value;
            const amount = parseFloat(amountInput);

            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount greater than 0.");
                return;
            }

            const customers = JSON.parse(localStorage.getItem('mm_customers') || '[]');
            const cust = customers[currentCustIndex];

            if (!cust) return;

            if (amount > cust.balance) {
                if(!confirm(\`The amount (₹\${amount}) is greater than the pending balance (₹\${cust.balance}). This will result in a negative balance (Advance Payment). Continue?\`)) {
                    return;
                }
            }

            // Deduct balance
            cust.balance -= amount;
            
            // Fix floating point math issues (e.g., 0.000000001)
            if (Math.abs(cust.balance) < 0.01) cust.balance = 0;

            localStorage.setItem('mm_customers', JSON.stringify(customers));
            
            // Sync with Supabase if function exists
            try {
                if (typeof dbAddCustomer === 'function') {
                    dbAddCustomer(cust.name, cust.phone, cust.address, cust.balance);
                }
            } catch(e) {}

            closeModal();
            renderKhata(); // Re-render grid
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderKhata);
    </script>
</body>
</html>
